spring.application.name=bibliotecas

# Configuración de H2: los datos viven solo durante la ejecución de la aplicación.
spring.datasource.url=jdbc:h2:mem:bibliotecas;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Spring crea y actualiza las tablas a partir de las entidades JPA.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
