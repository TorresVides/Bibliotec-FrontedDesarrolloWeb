<!-- Componente web: presenta los libros obtenidos dinámicamente desde el backend. -->
<section class="panel" aria-labelledby="titulo-libros">
  <h2 id="titulo-libros">Libros existentes</h2>

  <table>
    <thead>
      <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>Año</th>
        <th>Biblioteca</th>
      </tr>
    </thead>
    <tbody id="tabla-libros">
      <!-- Las filas se crean con JavaScript usando la respuesta de GET /bibliotecas. -->
    </tbody>
  </table>
</section>
